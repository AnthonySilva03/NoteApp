<!DOCTYPE html>
<html lang="en">

<head>
  <title>Programming Notes</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*" />

  <!--bootstrap -->
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />

  <!--jQuery -->
  <script src="./node_modules/jquery/dist/jquery.min.js"></script>
  <!--PouchDB -->
  <script src="./node_modules/pouchdb/dist/pouchdb.min.js"></script>
  <script src="./node_modules/pouchdb/dist/pouchdb.find.min.js"></script>
  <!--codeMirror -->
  <link rel="stylesheet" href="./node_modules/codemirror/lib/codemirror.css" />
  <link rel="stylesheet" href="./node_modules/codemirror/theme/material-darker.css" />
  <script src="./node_modules/codemirror/lib/codemirror.js"></script>
  <script src="./node_modules/codemirror/addon/edit/matchbrackets.js"></script>
  <script src="./node_modules/codemirror/addon/selection/active-line.js"></script>
  <script src="./node_modules/codemirror/addon/mode/simple.js"></script>
  <script src="./node_modules/codemirror/mode/javascript/javascript.js"></script>
  <script src="./node_modules/codemirror/mode/xml/xml.js"></script>
  <script src="./node_modules/codemirror/mode/css/css.js"></script>
  <script src="./node_modules/codemirror/mode/htmlmixed/htmlmixed.js"></script>
  <script src="./node_modules/codemirror/mode/clike/clike.js"></script>
  <script src="./node_modules/codemirror/mode/python/python.js"></script>
  <script src="./node_modules/codemirror/mode/sql/sql.js"></script>
  <script src="./node_modules/codemirror/mode/shell/shell.js"></script>
  <script src="./node_modules/codemirror/mode/powershell/powershell.js"></script>
  <script src="./node_modules/codemirror/mode/markdown/markdown.js"></script>
  <script src="./node_modules/codemirror/mode/yaml/yaml.js"></script>
  <script src="./node_modules/codemirror/mode/go/go.js"></script>
  <script src="./node_modules/codemirror/mode/rust/rust.js"></script>
  <script src="./node_modules/codemirror/mode/ruby/ruby.js"></script>
  <!--Quill v2-->
  <link rel="stylesheet" href="./node_modules/quill/dist/quill.snow.css" />
  <script src="./node_modules/quill/dist/quill.js"></script>
  <!--page style-->
  <link rel="stylesheet" href="style.css" />

  <!--controller-->
  <script src="dbcontroller.js" defer></script>

</head>

<body>
  <header id="app-header">
    <h3>CS Notes</h3>
    <div id="header-controls">
      <span class="badge badge-secondary" id="syncStatus">Sync off</span>
      <button class="btn btn-outline-secondary btn-sm" id="openSettings">Settings</button>
    </div>
  </header>

  <dialog id="settingsDialog">
    <form id="settingsForm" method="dialog">
      <h5>CouchDB Sync</h5>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="syncEnabled">
        <label class="form-check-label" for="syncEnabled">Sync with CouchDB</label>
      </div>
      <div class="form-group">
        <label for="couchUrl">Server URL</label>
        <input class="form-control" type="url" id="couchUrl" placeholder="http://127.0.0.1:5984">
      </div>
      <div class="form-group">
        <label for="couchUser">Username</label>
        <input class="form-control" type="text" id="couchUser" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="couchPassword">Password</label>
        <input class="form-control" type="password" id="couchPassword" autocomplete="new-password">
        <small class="form-text text-muted" id="passwordHint"></small>
      </div>
      <div class="text-danger mb-2" id="settingsError"></div>
      <div class="text-right">
        <button type="button" class="btn btn-secondary" id="cancelSettings">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveSettings">Save</button>
      </div>
    </form>
  </dialog>
  <div class="container-fluid">
    <div class="row">
      <div id="side-bar" class="col-sm-4 sidenav border">
        <h3>Enter Note Info</h3>
        <div class="form-group">
          <label for="language">Topic</label>
          <input id="language" list="language-list" name="language" type="text" class="form-control">
          <datalist id="language-list"></datalist>
        </div>
        <div class="form-group">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" class="form-control">
        </div>
        <div class="form-group">
          <label for="tags">Tags</label>
          <input id="tags" name="tags" type="text" class="form-control">
        </div>
        <div class="form-group">
          <button class="btn btn-primary" id="findNote">Find Note!</button>
        </div>
        <div id="noteTable"></div>
      </div>

      <div class="col-sm-8">
        <div id="note-area">
          <div class="editor-pane" id="noteDiv">
            <h6>Notes</h6>
            <div id="editor"></div>
          </div>

          <div class="editor-pane" id="codeDiv">
            <h6>Code Examples</h6>
            <div id="code"></div>
          </div>
        </div>

        <div class="form-group mt-2">
          <button class="btn btn-primary" id="addNote">Save Note!</button>
          <button class="btn btn-primary" id="deleteNote">Delete Note!</button>
          <button class="btn btn-primary" id="clearNote">Clear Note</button>
        </div>

        <div id="demo"></div>
      </div>
    </div>
  </div>
</body>

</html>
